<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500">
<title>A red emergency telephone sits between a blue globe and a red globe, its coiled cord linking the two powers</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#03060d"/><stop offset="1" stop-color="#0b1630"/></linearGradient>
<filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="500" fill="url(#bg)"/>
<g fill="#8b98b3">
<circle cx="54" cy="60" r="1.5" opacity=".35"/><circle cx="270" cy="30" r="1.2" opacity=".3"/><circle cx="470" cy="80" r="1.6" opacity=".45"/><circle cx="730" cy="52" r="1.3" opacity=".25"/><circle cx="940" cy="28" r="1.5" opacity=".4"/><circle cx="1140" cy="74" r="1.2" opacity=".3"/><circle cx="120" cy="440" r="1.3" opacity=".4"/><circle cx="380" cy="470" r="1.5" opacity=".3"/><circle cx="640" cy="440" r="1.2" opacity=".25"/><circle cx="860" cy="466" r="1.6" opacity=".4"/><circle cx="1090" cy="430" r="1.3" opacity=".3"/>
</g>
<g filter="url(#glow)" fill="none" stroke-linecap="round" stroke-linejoin="round">
<!-- US globe -->
<g stroke="#5aa9ff" stroke-width="3">
<circle cx="190" cy="250" r="100" fill="#5aa9ff" fill-opacity=".12"/>
<ellipse cx="190" cy="250" rx="45" ry="100"/>
<path d="M90 250 H290 M104 200 H276 M104 300 H276" stroke-width="2" opacity=".7"/>
<path d="M190 150 V350" stroke-width="2" opacity=".7"/>
</g>
<!-- China globe -->
<g stroke="#ff6b5a" stroke-width="3">
<circle cx="1010" cy="250" r="100" fill="#ff6b5a" fill-opacity=".12"/>
<ellipse cx="1010" cy="250" rx="45" ry="100"/>
<path d="M910 250 H1110 M924 200 H1096 M924 300 H1096" stroke-width="2" opacity=".7"/>
<path d="M1010 150 V350" stroke-width="2" opacity=".7"/>
</g>
<!-- coiled cords -->
<path d="M290 270 C320 270 330 300 350 300 c10 0 10 -24 20 -24 s10 24 20 24 s10 -24 20 -24 s10 24 20 24 s10 -24 20 -24 s10 24 20 24 C500 300 505 290 530 290" stroke="#ff3b5c" stroke-width="2.5"/>
<path d="M910 270 C880 270 870 300 850 300 c-10 0 -10 -24 -20 -24 s-10 24 -20 24 s-10 -24 -20 -24 s-10 24 -20 24 s-10 -24 -20 -24 s-10 24 -20 24 C700 300 695 290 670 290" stroke="#ff3b5c" stroke-width="2.5"/>
<!-- phone -->
<g stroke="#ff3b5c" stroke-width="3.5">
<path d="M545 262 L530 318 Q528 330 540 330 H660 Q672 330 670 318 L655 262 Z" fill="#ff3b5c" fill-opacity=".22"/>
<circle cx="600" cy="298" r="18"/>
<circle cx="600" cy="298" r="5" fill="#ff3b5c"/>
<path d="M535 232 Q600 196 665 232" stroke-width="10"/>
<path d="M520 222 L556 214 L564 244 Q544 254 526 250 Z M680 222 L644 214 L636 244 Q656 254 674 250 Z" fill="#ff3b5c" fill-opacity=".35"/>
</g>
<!-- call waves -->
<g stroke="#ffd76a" stroke-width="2.5" opacity=".85">
<path d="M560 180 Q600 160 640 180 M545 160 Q600 132 655 160"/>
</g>
<g stroke="#7fe3ff" stroke-width="2" opacity=".5">
<path d="M310 200 Q330 220 310 240 M325 188 Q352 220 325 252 M890 200 Q870 220 890 240 M875 188 Q848 220 875 252"/>
</g>
</g>
</svg>
